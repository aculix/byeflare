[workspace]
members = [".", "engine-bench"]
resolver = "3"

[package]
name = "byeflare"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
cfsolve = { path = "vendor/cfsolve", default-features = false }
lru = "0.12"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
wreq = { version = "=0.16.1", features = ["cookies", "gzip", "brotli", "deflate", "zstd", "socks", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[patch.crates-io]
btls-sys = { path = "vendor/cfsolve/vendor/btls-sys" }
wreq = { path = "vendor/cfsolve/vendor/wreq" }
http2 = { path = "vendor/cfsolve/vendor/http2" }
