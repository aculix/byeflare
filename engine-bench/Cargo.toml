[package]
name = "engine-bench"
version = "0.1.0"
edition = "2024"
description = "Compares browser engines on the job Prowlarr needs from a solver"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
libc = "0.2.191"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "socks", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-socks = "0.5.3"
tokio-tungstenite = "0.30.0"
